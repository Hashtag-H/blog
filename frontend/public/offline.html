<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>河南娃的小窝后台 - 离线</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        background: #f8fafc;
        color: #1f2d3d;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(420px, calc(100% - 32px));
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.86);
        padding: 28px;
        box-shadow: 0 20px 60px rgba(47, 64, 84, 0.1);
      }

      h1 {
        margin: 0;
        font-size: 24px;
      }

      p {
        margin: 12px 0 0;
        color: #64748b;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>后台暂时离线</h1>
      <p>本地服务可能还没有启动。请启动博客服务后重新打开后台。</p>
    </main>
  </body>
</html>
